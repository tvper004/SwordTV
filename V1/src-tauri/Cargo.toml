[package]
name = "swordtv"
version = "1.1.4"
description = "SwordTV - IPTV & Streaming Player for macOS"
authors = ["SwordTV"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "swordtv_lib"


[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
